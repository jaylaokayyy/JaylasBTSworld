<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayla的精神時光屋</title>
    <!-- 引入質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: rgba(22, 22, 24, 0.75);
            --card-hover: rgba(32, 32, 35, 0.85);
            --text-main: #f4f0ea;
            --text-muted: #a69f96;
            --accent-red: #c04848;
            --accent-gold: #d4af37;
            --accent-glow: rgba(192, 72, 72, 0.25);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 🖼️ 黑白潑墨暈染背景 Canvas */
        #ink-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            z-index: 1;
        }

        /* 頁首標題區塊 */
        header {
            margin-bottom: 45px;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f4f0ea 40%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1.5px;
        }

        /* 卡片網格區塊 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--accent-red);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
        }

        .card h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* 頁尾 */
        footer {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.7;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 黑白潑墨暈染背景 Canvas -->
    <canvas id="ink-canvas"></canvas>

    <div class="container">
        <!-- 頁面標題 -->
        <header>
            <h1>Jayla的精神時光屋</h1>
            <p>MY FOREVER LOVE SONG, BTS.</p>
        </header>

        <!-- 主選單區塊 -->
        <main class="grid-menu">
            <!-- 連結 1：高雄場應援物指南 -->
            <a href="https://jaylaokayyy.github.io/twkhfreebiesbyjla/" class="card" target="_blank">
                <div class="card-icon">🏮</div>
                <h2>高雄場應援物指南</h2>
                <p>應援物領取地圖、詳細發放資訊</p>
            </a>

            <!-- 連結 2：高雄場行程表 -->
            <a href="https://jaylaokayyy.github.io/jaylakhschedule/" class="card" target="_blank">
                <div class="card-icon">🗓️</div>
                <h2>高雄場行程表</h2>
                <p>演唱會行程、活動打卡與路線規劃</p>
            </a>
        </main>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>Powered by GitHub Pages</p>
    </footer>

    <!-- ✒️ 黑白潑墨暈染動畫腳本 -->
    <script>
        const canvas = document.getElementById('ink-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let inks = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // 墨雲（Ink Blob）類別：模擬黑白宣紙上的墨水暈染與擴散
        class InkCloud {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 200 + 120;
                this.maxRadius = this.radius + Math.random() * 80;
                this.growth = Math.random() * 0.15 + 0.05;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.alpha = 0;
                this.maxAlpha = Math.random() * 0.06 + 0.015; // 淡淡的黑灰色，不喧賓奪主
                this.fadingIn = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.fadingIn) {
                    this.alpha += 0.0005;
                    this.radius += this.growth;
                    if (this.alpha >= this.maxAlpha || this.radius >= this.maxRadius) {
                        this.fadingIn = false;
                    }
                } else {
                    this.alpha -= 0.0003;
                    if (this.alpha <= 0) {
                        this.reset();
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createRadialGradient(this.x, this.y, 5, this.x, this.y, this.radius);
                // 純黑白灰的墨韻階調
                grad.addColorStop(0, `rgba(220, 220, 225, ${this.alpha * 1.2})`);
                grad.addColorStop(0.5, `rgba(120, 120, 130, ${this.alpha * 0.6})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function init() {
            inks = [];
            for (let i = 0; i < 8; i++) {
                inks.push(new InkCloud());
            }
        }

        init();

        function animate() {
            // 背景維持沉穩墨色殘影
            ctx.fillStyle = 'rgba(11, 11, 12, 0.15)';
            ctx.fillRect(0, 0, width, height);

            inks.forEach(ink => {
                ink.update();
                ink.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
