<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💜 我的追星小天地 | BTS Starlight Space</title>
    <!-- 引入 Google Fonts 質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0e17;
            --card-bg: #1a1926;
            --text-main: #fffffe;
            --text-muted: #a7a9be;
            --accent-purple: #9b51e0;
            --accent-glow: rgba(155, 81, 224, 0.4);
            --border-color: #2e2b44;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* 標頭區塊 */
        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fffffe 30%, #b886fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        /* 連結卡片網格 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-purple);
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* 預留未來擴充用的空白卡片樣式（可選） */
        .card.coming-soon {
            opacity: 0.6;
            border-style: dashed;
            pointer-events: none;
        }

        /* 頁尾 */
        footer {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        footer span {
            color: var(--accent-purple);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頁面標題 -->
        <header>
            <h1>💜 ɪᴍ_ᴊʟ'ꜱ ꜱᴛᴀʀʟɪɢʜᴛ ꜱᴘᴀᴄᴇ</h1>
            <p>記錄美好追星日常與專屬應援指南</p>
        </header>

        <!-- 導航卡片區塊 (未來可隨時在這裡增加新的 <a> 卡片) -->
        <main class="grid-menu">
            <!-- 專案 1：高雄場應援物指南 -->
            <a href="https://jaylaokayyy.github.io/twkhfreebiesbyjla/" class="card" target="_blank">
                <div class="card-icon">🎁</div>
                <h2>高雄場應援物指南</h2>
                <p>統整高雄演唱會的各種精美應援領取資訊與地圖指南</p>
            </a>

            <!-- 專案 2：行程活動表 -->
            <a href="https://jaylaokayyy.github.io/" class="card" target="_blank">
                <div class="card-icon">📅</div>
                <h2>行程活動表</h2>
                <p>詳細的演唱會行程、活動時間與追星計畫時程總覽</p>
            </a>

            <!-- 未來擴充範例：如果之後新增其他網站，直接複製下方這段修改網址和文字即可
            <a href="你的新網址" class="card" target="_blank">
                <div class="card-icon">✨</div>
                <h2>新專案標題</h2>
                <p>新專案的簡短說明文字...</p>
            </a>
            -->
        </main>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>A.R.M.Y 💜 Forever Keep Going | Powered by <span>GitHub Pages</span></p>
    </footer>

</body>
</html>
