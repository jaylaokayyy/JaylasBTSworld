<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayla的精神時光屋</title>
    <!-- 引入質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060309;
            --card-bg: rgba(22, 14, 32, 0.75);
            --card-hover: rgba(38, 22, 56, 0.85);
            --text-main: #f4f0ea;
            --text-muted: #c2b6cf;
            --accent-purple: #9b51e0;
            --accent-pink: #d88bf8;
            --accent-glow: rgba(155, 81, 224, 0.4);
            --border-color: rgba(184, 115, 230, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌌 圖片同款紫色銀河與流星背景 Canvas */
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            z-index: 1;
        }

        /* 頁首標題區塊 */
        header {
            margin-bottom: 45px;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 2px;
            /* 💜 紫色漸層大標題 */
            background: linear-gradient(135deg, #f4f0ea 20%, #e0aaff 60%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(155, 81, 224, 0.5);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1.5px;
        }

        /* 卡片網格區塊 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
            border-color: var(--accent-pink);
            box-shadow: 0 12px 35px var(--accent-glow), 0 0 15px rgba(216, 139, 248, 0.2);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 10px rgba(155, 81, 224, 0.6));
        }

        .card h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* 頁尾 */
        footer {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.7;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 紫色銀河星雲與流星 Canvas -->
    <canvas id="galaxy-canvas"></canvas>

    <div class="container">
        <!-- 頁面標題 -->
        <header>
            <h1>Jayla的精神時光屋</h1>
            <p>MY FOREVER LOVE SONG, BTS.</p>
        </header>

        <!-- 主選單區塊 -->
        <main class="grid-menu">
            <!-- 連結 1：高雄場應援物指南 -->
            <a href="https://jaylaokayyy.github.io/twkhfreebiesbyjla/" class="card" target="_blank">
                <div class="card-icon">🏮</div>
                <h2>高雄場應援物指南</h2>
                <p>應援物領取地圖、詳細發放資訊</p>
            </a>

            <!-- 連結 2：高雄場行程表 -->
            <a href="https://jaylaokayyy.github.io/jaylakhschedule/" class="card" target="_blank">
                <div class="card-icon">🗓️</div>
                <h2>高雄場行程表</h2>
                <p>演唱會行程、活動打卡與路線規劃</p>
            </a>
        </main>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>Powered by GitHub Pages</p>
    </footer>

    <!-- ✨ 模擬圖片同款紫色渦旋星雲與流星動畫腳本 -->
    <script>
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let shootingStars = [];
        let nebulaClouds = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            init();
        }

        window.addEventListener('resize', resize);

        // 1. 紫色渦旋星雲雲氣（Nebula Cloud）
        class NebulaCloud {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 250 + 150;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = (Math.random() - 0.5) * 0.0015;
                
                // 圖片同款色彩：深深淺淺的防彈紫色、紫粉與星雲白光
                const colors = [
                    'rgba(88, 24, 120, 0.22)',   /* 深防彈紫 */
                    'rgba(142, 45, 190, 0.18)',  /* 明亮紫 */
                    'rgba(195, 80, 220, 0.15)',  /* 紫粉色 */
                    'rgba(60, 10, 80, 0.28)',    /* 宇宙深紫 */
                    'rgba(230, 200, 255, 0.08)'  /* 星雲中心微光 */
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.angle += this.speed;
            }

            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                
                const grad = ctx.createRadialGradient(
                    this.x, this.y, 5,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, this.color);
                grad.addColorStop(0.5, this.color.replace(/[\d\.]+\)$/, '0.08)'));
                grad.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 2. 閃爍星星（Star）
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.8 + 0.3;
                this.baseAlpha = Math.random() * 0.8 + 0.2;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.012 + 0.004;
                this.twinkleDir = Math.random() > 0.5 ? 1 : -1;
                
                // 部分星星帶有微微淡紫色光暈
                this.color = Math.random() > 0.3 ? '#ffffff' : '#e2bbfd';
            }

            update() {
                this.alpha += this.twinkleSpeed * this.twinkleDir;
                if (this.alpha > 0.95 || this.alpha < 0.2) {
                    this.twinkleDir *= -1;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 3. 流星（Shooting Star）
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width * 1.2;
                this.y = Math.random() * (height * 0.4);
                this.length = Math.random() * 90 + 50;
                this.speed = Math.random() * 8 + 6;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.2;
                this.opacity = 1;
                this.active = false;
                this.timer = Math.random() * 250 + 80;
            }

            update() {
                if (!this.active) {
                    this.timer--;
                    if (this.timer <= 0) {
                        this.active = true;
                    }
                    return;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.018;

                if (this.opacity <= 0 || this.x > width || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                if (!this.active) return;

                ctx.save();
                const tailX = this.x - Math.cos(this.angle) * this.length;
                const tailY = this.y - Math.sin(this.angle) * this.length;

                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                grad.addColorStop(0.4, `rgba(216, 139, 248, ${this.opacity * 0.8})`);
                grad.addColorStop(1, 'rgba(155, 81, 224, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
                ctx.restore();
            }
        }

        function init() {
            stars = [];
            shootingStars = [];
            nebulaClouds = [];

            // 建立紫色星雲層
            for (let i = 0; i < 12; i++) {
                nebulaClouds.push(new NebulaCloud());
            }

            // 建立繁星
            const starCount = Math.floor((width * height) / 3000);
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }

            // 建立流星
            for (let i = 0; i < 3; i++) {
                shootingStars.push(new ShootingStar());
            }
        }

        resize();

        function animate() {
            // 暗紫宇宙底色殘影
            ctx.fillStyle = 'rgba(6, 3, 9, 0.22)';
            ctx.fillRect(0, 0, width, height);

            // 1. 繪製紫粉星雲
            nebulaClouds.forEach(cloud => {
                cloud.update();
                cloud.draw();
            });

            // 2. 繪製閃爍星星
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // 3. 繪製流星
            shootingStars.forEach(ss => {
                ss.update();
                ss.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
