<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayla的精神時光屋</title>
    <!-- 引入質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ARIRANG 專輯風格色調 (沉穩傳統古風與質感莫蘭迪紅) */
            --bg-color: #121113;
            --card-bg: rgba(28, 26, 29, 0.85);
            --card-hover: rgba(37, 34, 39, 0.95);
            --text-main: #f4f0ea;
            --text-muted: #a69f96;
            --accent-red: #c04848;
            --accent-purple: #9b51e0;
            --accent-glow: rgba(192, 72, 72, 0.25);
            --border-color: #2e2a30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            /* 調整整體 padding，增加頂部間距讓內容自然下移 */
            padding: 0 20px 60px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🖼️ 頂部光化門剪影圖融合區塊 */
        .hero-silhouette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 380px; /* 剪影區域高度 */
            /* 請替換成你的 BTS 光化門剪影圖片連結 */
            background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1200&auto=format&fit=crop'); 
            background-position: top center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0.35; /* 調整透明度讓剪影自然暗沈融入背景 */
            z-index: 0;
            /* 將圖片底部漸層羽化融入背景 */
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            z-index: 1;
            /* 把主內容整體往下一點（頂部增加 140px 間距） */
            margin-top: 140px; 
        }

        /* 頁首標題區塊 */
        header {
            margin-bottom: 45px;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 2px;
            /* 白亮比例提升的紫金漸層大標題 */
            background: linear-gradient(135deg, #ffffff 0%, #f4f0ea 45%, #e0aaff 75%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.2);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* 卡片網格區塊 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--accent-red);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
        }

        .card h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* 頁尾 */
        footer {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.7;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 頂部光化門剪影背景圖 -->
    <div class="hero-silhouette"></div>

    <div class="container">
        <!-- 頁面標題 -->
        <header>
            <h1>Jayla的精神時光屋</h1>
            <p>MY FOREVER LOVE SONG, BTS.</p>
        </header>

        <!-- 主選單區塊 -->
        <main class="grid-menu">
            <!-- 連結 1：高雄場應援物指南 (珍奶🧋) -->
            <a href="https://jaylaokayyy.github.io/twkhfreebiesbyjla/" class="card" target="_blank">
                <div class="card-icon">🧋</div>
                <h2>高雄場應援物指南</h2>
                <p>應援物領取地圖、詳細發放資訊</p>
            </a>

            <!-- 連結 2：高雄場行程表 -->
            <a href="https://jaylaokayyy.github.io/jaylakhschedule/" class="card" target="_blank">
                <div class="card-icon">🗓️</div>
                <h2>高雄場行程表</h2>
                <p>演唱會行程、活動打卡與路線規劃</p>
            </a>
        </main>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>Powered by GitHub Pages</p>
    </footer>

</body>
</html>
