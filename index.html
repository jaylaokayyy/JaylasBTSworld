<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayla的精神時光屋</title>
    <!-- 引入質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 搭配深藍夜空色調 */
            --bg-color: #0a0f18;
            --card-bg: rgba(20, 25, 38, 0.85);
            --card-hover: rgba(30, 38, 56, 0.95);
            --text-main: #f4f0ea;
            --text-muted: #a6b0c2;
            --accent-red: #c04848;
            --accent-purple: #9b51e0;
            --accent-glow: rgba(155, 81, 224, 0.3);
            --border-color: rgba(155, 81, 224, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px 60px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🖼️ 光化門剪影背景區塊 */
        .hero-silhouette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 380px; /* 稍微調降高度，讓手機上比例更完美 */
            /* 請確保圖片檔名與這裡一致，若在同資料夾可直接填檔名 */
            background-image: url('光化門剪影.webp'); 
            background-position: top center;
            /* 改為 contain：確保手機上能看到完整整張圖（七個人不被切掉） */
            background-size: contain; 
            background-repeat: no-repeat;
            opacity: 0.85; 
            z-index: 0;
            /* 圖片底部羽化漸層融入深色背景 */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            z-index: 1;
            /* 配合上方圖片高度調整內容下移距離 */
            margin-top: 240px; 
        }

        /* 頁首標題區塊 */
        header {
            margin-bottom: 45px;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #f4f0ea 45%, #e0aaff 75%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(155, 81, 224, 0.4);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* 卡片網格區塊 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--accent-purple);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
        }

        .card h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* 頁尾 */
        footer {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.7;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 頂部光化門剪影背景圖 -->
    <div class="hero-silhouette"></div>

    <div class="container">
        <!-- 頁面標題 -->
        <header>
            <h1>Jayla的精神時光屋</h1>
            <p>MY FOREVER LOVE SONG, BTS.</p>
        </header>

        <!-- 主選單區塊 -->
        <main class="grid-menu">
            <!-- 連結 1：高雄場應援物指南 (珍奶🧋) -->
            <a href="https://jaylaokayyy.github.io/twkhfreebiesbyjla/" class="card" target="_blank">
                <div class="card-icon">🧋</div>
                <h2>高雄場應援物指南</h2>
                <p>應援物領取地圖、詳細發放資訊</p>
            </a>

            <!-- 連結 2：高雄場行程表 -->
            <a href="https://jaylaokayyy.github.io/jaylakhschedule/" class="card" target="_blank">
                <div class="card-icon">🗓️</div>
                <h2>高雄場行程表</h2>
                <p>演唱會行程、活動打卡與路線規劃</p>
            </a>
        </main>
    </div>

    <!-- 頁尾 -->
    <footer>
        <p>Powered by GitHub Pages</p>
    </footer>

</body>
</html>
